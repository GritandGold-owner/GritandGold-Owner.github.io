<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grit & Gold Pecans™ | Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #ffffff;
      color: #ffffff;
    }

    /* TOP NAVIGATION */
    .navbar {
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 12px 6%;
    }

    .wordmark {
      width: 280px;
      max-width: 65vw;
      height: auto;
      display: block;
    }

    /* HERO */
    .hero {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;

      background:
        linear-gradient(
          rgba(20, 28, 18, 0.58),
          rgba(20, 28, 18, 0.76)
        ),
        url("orchard.jpg") center center / cover no-repeat;
    }

    .hero-content {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .primary-logo {
      width: 430px;
      max-width: 82vw;
      height: auto;
      margin: 0 auto 22px;
      display: block;
    }

    .veteran {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 8px 0 22px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      margin: 0 0 16px;
      line-height: 1.05;
    }

    .harvest {
      font-size: clamp(1.15rem, 2.5vw, 1.6rem);
      margin: 0 0 15px;
    }

    .tagline {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-style: italic;
      margin: 0 0 32px;
    }

    .contact {
      border-top: 1px solid rgba(255,255,255,0.55);
      padding-top: 24px;
      font-size: 1rem;
      line-height: 1.8;
    }

    .contact a {
      color: #ffffff;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .copyright {
      margin-top: 22px;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .navbar {
        height: 75px;
        padding: 10px 20px;
        justify-content: center;
      }

      .wordmark {
        width: 235px;
      }

      .hero {
        min-height: calc(100vh - 75px);
        padding: 35px 18px;
      }

      .primary-logo {
        width: 330px;
      }
    }
  </style>
</head>

<body>

  <!-- WEBSITE NAVIGATION / WORDMARK -->
  <nav class="navbar">
    <img
      src="logo-wordmark-full-color.svg"
      alt="Grit & Gold Pecans"
      class="wordmark"
    >
  </nav>

  <!-- WEBSITE HERO -->
  <main class="hero">
    <div class="hero-content">

      <img
        src="logo-primary-white.svg"
        alt="Grit & Gold Pecans"
        class="primary-logo"
      >

      <div class="veteran">
        Veteran Owned • Georgia Grown
      </div>

      <h1>Website Coming Soon</h1>

      <p class="harvest">
        Fresh Georgia Pecans — Harvest 2026
      </p>

      <p class="tagline">
        From Our Orchard to Your Table.
      </p>

      <div class="contact">
        <div>Monticello, Georgia</div>

        <div>
          <a href="tel:7707154173">770-715-4173</a>
        </div>

        <div>
          <a href="mailto:gritandgold@gritandgoldpecans.com">
            gritandgold@gritandgoldpecans.com
          </a>
        </div>

        <div class="copyright">
          © 2026 Grit & Gold Pecans LLC
        </div>
      </div>

    </div>
  </main>

</body>
</html>
